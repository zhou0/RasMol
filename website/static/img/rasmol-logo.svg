<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE7C5" />
      <stop offset="40%" stop-color="#D6CE9F" />
      <stop offset="100%" stop-color="#A39A6B" />
    </linearGradient>

    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#D6D6FC" />
      <stop offset="55%" stop-color="#9CA0E6" />
      <stop offset="85%" stop-color="#686AA3" />
      <stop offset="100%" stop-color="#464773" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <polygon points="100,50 50,130 58,135 108,55" fill="url(#bondGrad)" />
    
    <polygon points="100,50 150,130 142,135 92,55" fill="url(#bondGrad)" />
    
    <rect x="50" y="125" width="100" height="10" fill="url(#bondGrad)" />

    <circle cx="100" cy="50" r="42" fill="url(#sphereGrad)" />

    <circle cx="50" cy="130" r="42" fill="url(#sphereGrad)" />

    <circle cx="150" cy="130" r="42" fill="url(#sphereGrad)" />
  </g>
</svg>
