name: Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja

      - name: Install WiX
        run: dotnet tool install --global WiX

      - name: Install Dependencies (Choco)
        run: |
          choco install magicsplat-tcl-tk --version=1.16.0

      - name: Locate Tcl/Tk
        id: tcl-paths
        shell: pwsh
        run: |
          # Search for tcl.h excluding MinGW, Miniconda, and R paths
          $tclHeaders = Get-ChildItem -Path C:\ -Filter tcl.h -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "mingw" -and $_.FullName -notmatch "Miniconda" -and $_.FullName -notmatch "R-" }

          $found = $false
          foreach ($header in $tclHeaders) {
              $root = $header.Directory.Parent.FullName
              $tclLib = Get-ChildItem -Path $root -Filter tcl86t.lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              $tkLib = Get-ChildItem -Path $root -Filter tk86t.lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

              if ($null -ne $tclLib -and $null -ne $tkLib) {
                  echo "TCL_ROOT=$root" >> $env:GITHUB_ENV
                  echo "TCL_INCLUDE=$($header.DirectoryName)" >> $env:GITHUB_ENV
                  echo "TCL_LIB_PATH=$($tclLib.FullName)" >> $env:GITHUB_ENV
                  echo "TK_LIB_PATH=$($tkLib.FullName)" >> $env:GITHUB_ENV
                  $found = $true
                  Write-Host "Found Tcl at $root"
                  break
              }
          }
          if (-not $found) { throw "Compatible MagicSplat Tcl/Tk not found (checked headers, tcl86t.lib, and tk86t.lib)" }

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DPIXELDEPTH=32 `
            -DTCL_INCLUDE_PATH="$env:TCL_INCLUDE" `
            -DTK_INCLUDE_PATH="$env:TCL_INCLUDE" `
            -DTCL_LIBRARY="$env:TCL_LIB_PATH" `
            -DTK_LIBRARY="$env:TK_LIB_PATH"

      - name: Build
        run: cmake --build build --target rasmol_tcl

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/install_dir"

      - name: Package
        run: |
          cd build
          cpack -C Release -G WIX

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: RasMol-Windows-MSI
          path: build/*.msi

  linux-appimage:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxi-dev libhdf5-dev tcl-dev tk-dev bison libxpm-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIXELDEPTH=32

      - name: Build
        run: cmake --build build --config Release --target rasmol_tcl

      - name: Install
        run: cmake --install build --config Release --prefix AppDir/usr

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/48x48/apps
          cp rasmol.desktop AppDir/
          sudo apt-get install -y imagemagick
          convert src/rasmol_48x48.xpm AppDir/rasmol.png
          cp AppDir/rasmol.png AppDir/usr/share/icons/hicolor/48x48/apps/rasmol.png

      - name: Install linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppRun
          chmod +x linuxdeploy-x86_64.AppRun
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppRun
          chmod +x linuxdeploy-plugin-appimage-x86_64.AppRun

      - name: Build AppImage
        run: |
          export ARCH=x86_64
          ./linuxdeploy-x86_64.AppRun --appdir AppDir --plugin appimage --output appimage
        env:
          OUTPUT: RasMol-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: RasMol-Linux-AppImage
          path: "*.AppImage"

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies (macOS)
        run: |
          brew install bison tcl-tk
          echo "/usr/local/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/tcl-tk/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/tcl-tk/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          if [ -d "/opt/homebrew/opt/tcl-tk" ]; then
            TCL_ROOT="/opt/homebrew/opt/tcl-tk"
          else
            TCL_ROOT="/usr/local/opt/tcl-tk"
          fi
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DPIXELDEPTH=32 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DVTK_DIR="" \
            -DTCL_INCLUDE_PATH="$TCL_ROOT/include" \
            -DTK_INCLUDE_PATH="$TCL_ROOT/include" \
            -DTCL_LIBRARY="$TCL_ROOT/lib/libtcl8.6.dylib" \
            -DTK_LIBRARY="$TCL_ROOT/lib/libtk8.6.dylib"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          cd build
          cpack -C Release -G DragNDrop

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: RasMol-MacOS-DMG
          path: build/*.dmg
